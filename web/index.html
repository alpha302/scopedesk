<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScopeDesk · 持续资产监控</title><link rel="stylesheet" href="./style.css"><script defer src="./vue.global.prod.js"></script><script defer src="./app.js"></script></head><body><div id="app" v-cloak>
<div v-if="loading" class="loading">正在加载工作台…</div><div v-else-if="!me" class="login-shell"><div class="login-card"><div class="brand"><span class="logo">S</span>ScopeDesk</div><h1>登录工作台</h1><p class="muted">持续关注授权资产，记录每一次变化。</p><form @submit.prevent="login"><label>用户名<input v-model="loginForm.name" autocomplete="username" required></label><label>密码<input v-model="loginForm.password" type="password" autocomplete="current-password" maxlength="128" required></label><p v-if="message" class="notice error">{{message}}</p><button :disabled="busy">登录</button></form><small>授权范围 · 持续监控 · 每日摘要</small></div></div>
<template v-else><aside><div class="brand"><span class="logo">S</span>ScopeDesk</div><small class="side-caption">持续资产监控 / v0.3</small><nav><button v-for="n in navigation" :key="n[0]" :class="{active:primaryPage===n[0]}" @click="navigate(n[0])"><span>{{n[2]}}</span>{{n[1]}}</button></nav><div class="side-user"><span class="avatar">{{me.name.slice(0,1).toUpperCase()}}</span><div><b>{{me.name}}</b><small>{{role(me.role)}}</small></div><button class="icon-button" @click="logout" aria-label="退出登录">↪</button></div></aside><main><div v-if="projects.length>1" class="project-switch"><label>当前项目<select v-model="activeProject" @change="changeProject"><option value="">全部可见项目</option><option v-for="p in projects" :key="p.id" :value="String(p.id)">{{workspaces.length>1?p.workspace_name+' / ':''}}{{p.name}}</option></select></label></div><header><span>ScopeDesk <i>/</i> {{title}}</span><span>PostgreSQL · {{role(me.role)}}</span></header><div class="page-heading"><div><h1>{{title}}</h1><p>授权范围 → 发现 → 画像 → 变化 → 通知</p></div><button class="secondary" @click="loadPage" :disabled="busy">刷新</button></div><div v-if="primaryPage==='assets'" class="tabs" aria-label="资产页面"><button :class="{active:page==='assets'}" @click="navigate('assets')">资产列表</button><button :class="{active:page==='events'}" @click="navigate('events')">变更事件</button></div>
<div v-if="primaryPage==='settings'" class="tabs settings-tabs" aria-label="设置分类"><button v-for="item in settingsNavigation" :key="item[0]" :class="{active:page===item[0]}" @click="navigate(item[0])">{{item[1]}}</button></div>
<p v-if="message" class="notice" :class="{error:isError}" role="status">{{message}}<button class="dismiss" @click="message=''">×</button></p>

<template v-if="page==='exploration'">
<section v-if="canWrite" class="panel"><h2>企业候选探索</h2><p class="hint">人工导入可用；ENScan 和商业 API 当前仅预留适配接口，尚未配置。这里的候选不会被解析或探测，也不会自动成为授权范围。</p><div class="filter-grid"><label v-if="writableProjects.length!==1">归属项目<select v-model.number="enterpriseForm.project_id"><option :value="0">请选择</option><option v-for="p in writableProjects" :key="p.id" :value="p.id">{{p.name}}</option></select></label><label>企业全称<input v-model="enterpriseForm.company" maxlength="200"></label><label>数据入口<select v-model="enterpriseForm.source"><option value="manual">人工导入</option><option value="enscan">ENScan（{{enterpriseSources.find(s=>s.name==='enscan')?.available?'可用':'未配置'}}）</option><option value="commercial">商业 API（{{enterpriseSources.find(s=>s.name==='commercial')?.available?'可用':'未配置'}}）</option></select></label></div><details><summary>高级设置 · 查询规模与预算</summary><div class="filter-grid"><label>穿透深度<input type="number" min="0" max="5" v-model.number="enterpriseForm.max_depth"></label><label>企业数上限<input type="number" min="1" max="500" v-model.number="enterpriseForm.max_companies"></label><label>候选数上限<input type="number" min="1" max="5000" v-model.number="enterpriseForm.max_candidates"></label><label>来源请求预算<input type="number" min="1" max="1000" v-model.number="enterpriseForm.request_limit"></label></div></details><label v-if="enterpriseForm.source==='manual'">候选域名（每行一个）<textarea v-model="enterpriseDomains" rows="6" placeholder="example.com"></textarea></label><button :disabled="busy" @click="createEnterpriseRun">{{enterpriseForm.source==='manual'?'保存候选':'查询企业数据'}}</button></section>
<section class="panel"><h2>来源查询记录 · {{enterpriseRuns.total}}</h2><p class="hint">“未知”表示本次没有得到可靠结果；不完整查询仅展示已取得数量，尚无有效候选时显示未知；完整返回 0 也不代表企业没有其他资产。</p><div class="table-wrap"><table><thead><tr><th>企业 / 项目</th><th>入口 / 状态</th><th>本次返回</th><th>预算 / 企业数</th><th>时间</th></tr></thead><tbody><tr v-for="run in enterpriseRuns.items" :key="run.id"><td>{{run.company}}<small class="cell-sub">{{projectName(run.project_id)}}</small></td><td>{{run.source}} / {{enterpriseStatus(run.status)}}<small v-if="run.error_code" class="cell-sub">{{enterpriseError(run.error_code)}}</small></td><td>{{run.result_count===null?'未知':run.result_count+' 个候选'}}<small class="cell-sub">{{run.complete?'已完成':'结果不完整'}} · {{run.absence_usable?'来源已完整返回':'不可作为无关联的依据'}}</small></td><td>{{run.requests_used}} / {{run.request_limit}} 次<small class="cell-sub">{{run.companies_seen}} / {{run.max_companies}} 家</small></td><td>{{date(run.created_at)}}</td></tr><tr v-if="!enterpriseRuns.items.length"><td colspan="5" class="empty">暂无查询记录。</td></tr></tbody></table></div><div class="pagination"><button class="secondary" :disabled="enterpriseRunPage<=1" @click="enterprisePage('runs',-1)">上一页</button><span>{{enterpriseRunPage}}</span><button class="secondary" :disabled="enterpriseRunPage*50>=enterpriseRuns.total" @click="enterprisePage('runs',1)">下一页</button></div></section>
<section class="panel"><h2>待审候选池 · {{enterpriseCandidates.total}}</h2><p class="hint">归属尚未自动评分。确认归属后，还需明确确认授权才能登记精确范围；创建后可在目标规则中另行配置子域授权。</p><div class="table-wrap"><table><thead><tr><th>域名 / 企业</th><th>项目 / 状态</th><th>归属线索</th><th>处理</th></tr></thead><tbody><tr v-for="c in enterpriseCandidates.items" :key="c.id"><td class="mono">{{c.domain}}<small class="cell-sub">{{c.company}}</small></td><td>{{projectName(c.project_id)}}<small class="cell-sub">{{enterpriseStatus(c.status)}} · {{c.attribution_score===null?'未评分':c.attribution_score}}</small></td><td><details><summary>{{c.evidence.length}} 条来源记录</summary><div v-for="(ev,i) in c.evidence" :key="i"><b>{{ev.source}} · #{{ev.run_id}} · 深度 {{ev.depth}}</b><p v-for="(item,j) in ev.evidence" :key="j">{{item.dimension}} / {{item.state}}：{{item.value}}</p></div></details></td><td><div v-if="scopeCanWrite(c)" class="button-group"><button v-if="c.status!=='confirmed'" class="secondary" :disabled="busy" @click="reviewEnterprise(c,'confirmed')">确认归属并创建目标</button><button class="secondary" :disabled="busy" @click="reviewEnterprise(c,'rejected')">排除候选</button><button :disabled="busy||c.status!=='confirmed'" @click="importEnterprise(c)">{{c.imported_scope_id?'查看目标 #'+c.imported_scope_id:'转为目标'}}</button></div></td></tr><tr v-if="!enterpriseCandidates.items.length"><td colspan="4" class="empty">暂无候选。</td></tr></tbody></table></div><div class="pagination"><button class="secondary" :disabled="enterpriseCandidatePage<=1" @click="enterprisePage('candidates',-1)">上一页</button><span>{{enterpriseCandidatePage}}</span><button class="secondary" :disabled="enterpriseCandidatePage*50>=enterpriseCandidates.total" @click="enterprisePage('candidates',1)">下一页</button></div></section>
</template>
<template v-if="page==='projects'">
<section class="panel"><div class="panel-heading"><h2>项目与执行策略</h2><button v-if="me.role!=='readonly'" @click="newProject">新增项目</button></div><p class="hint">工作空间成员不自动获得全部项目权限；工作空间管理员可管理其中的项目。项目停用或到期后阻止后续请求。</p>
<div class="table-wrap"><table><thead><tr><th>{{workspaces.length>1?'工作空间 / 项目':'项目'}}</th><th>执行规则</th><th>操作</th></tr></thead><tbody><tr v-for="p in projects" :key="p.id"><td>{{workspaces.length>1?p.workspace_name+' / ':''}}{{p.name}}<small class="cell-sub">{{p.can_manage?'可管理':p.can_write?'可执行':'仅查看'}}</small></td><td>{{p.enabled?'启用':'停用'}} · {{p.allow_active?'允许范围选择主动探测':'禁止主动探测'}} · 项目合计上限 {{p.rps_limit}} RPS<small class="cell-sub">{{p.expires_at?date(p.expires_at):'未设置到期时间'}}</small><a v-if="p.rules_url" :href="p.rules_url" target="_blank" rel="noopener noreferrer">测试规则</a></td><td><template v-if="p.can_manage&&me.role!=='readonly'"><button class="text-button" @click="editProject(p)">编辑</button><button class="text-button" @click="manageMembers('projects',p.id)">成员</button></template></td></tr></tbody></table></div></section>
<section v-if="projectEditor" class="panel"><h2>{{projectEditor.id?'编辑项目':'新增项目'}}</h2><form @submit.prevent="saveProject"><label v-if="workspaces.length>1">工作空间<select v-model.number="projectEditor.workspace_id" :disabled="!!projectEditor.id"><option :value="0">我的默认私有工作空间</option><option v-for="ws in workspaces.filter(w=>w.can_manage)" :value="ws.id">{{ws.name}}</option></select></label><label>项目名称<input v-model="projectEditor.name" maxlength="100" required></label><label>测试规则链接（可选）<input v-model="projectEditor.rules_url" type="url"></label><label>授权到期时间（可选，UTC）<input v-model="projectEditor.expires_at" type="datetime-local"></label><label>项目合计速率上限（RPS）<input v-model.number="projectEditor.rps_limit" type="number" min="0.1" max="5" step="0.1" required></label><label class="checkbox"><input v-model="projectEditor.enabled" type="checkbox">启用项目</label><label class="checkbox"><input v-model="projectEditor.allow_active" type="checkbox">允许范围自行启用主动探测</label><p class="hint">允许主动探测后，仍需各范围明确开启。未设置有效期不会自动到期。外部插件内部请求不计入平台精确限速。</p><button :disabled="busy">保存项目</button> <button type="button" class="secondary" @click="projectEditor=null">关闭</button></form></section>
<section class="panel"><details :open="workspaces.length>1"><summary>{{workspaces.length>1?'工作空间':'工作空间管理（可选）'}}</summary><p v-for="ws in workspaces" :key="ws.id">{{ws.name}} <button v-if="ws.can_manage&&me.role!=='readonly'" class="text-button" @click="manageMembers('workspaces',ws.id)">管理成员</button></p><button v-if="me.role!=='readonly'" class="secondary" @click="workspaceCreatorOpen=!workspaceCreatorOpen">{{workspaceCreatorOpen?'收起':'新增工作空间'}}</button><form v-if="workspaceCreatorOpen&&me.role!=='readonly'" @submit.prevent="createWorkspace"><label>工作空间名称<input v-model="workspaceName" maxlength="100" required></label><button :disabled="busy">创建工作空间</button></form></details></section>
<section v-if="memberTarget" class="panel"><h2>{{memberTarget.kind==='projects'?'项目成员':'工作空间成员'}}</h2><p class="hint">所有者具有固有管理权限；移除下表授权不会移除所有者身份。项目成员须先加入工作空间。</p><p class="hint" v-if="memberTarget.kind==='projects'">查看者：只读项目数据。执行操作员：可修改范围、资产和计划，执行及取消任务（含授权允许的主动探测）。项目管理员：另可修改项目策略和成员，可授予多人；不等于项目所有者。所有执行仍受授权及项目策略限制。</p><form @submit.prevent="saveMember"><label>用户 ID<input v-model="memberForm.user_id" type="number" min="1" required></label><label>角色<select v-model="memberForm.role"><option value="viewer">查看者（viewer）</option><option v-if="memberTarget.kind==='projects'" value="operator">执行操作员（operator）</option><option v-else value="member">成员（项目权限另授）</option><option value="admin">{{memberTarget.kind==='projects'?'项目管理员（admin）':'工作空间管理员（admin）'}}</option></select></label><button :disabled="busy">保存授权</button> <button type="button" class="secondary" @click="memberTarget=null">关闭</button></form><p v-for="m in memberList">用户 {{m.user_id}} · {{membershipRole(m.role,memberTarget.kind)}} <button class="text-button" @click="removeMember(m.user_id)" :disabled="busy">移除授权</button></p></section>
</template>
<template v-if="page==='overview'"><section class="stats"><article><span>资产总数</span><strong>{{summary.total}}</strong><small>当前账户可见资产</small></article><article><span>今日新增</span><strong>{{summary.today_new}}</strong><small>上海时区自然日</small></article><article><span>记录为 HTTP 有响应</span><strong>{{summary.alive}}</strong><small>历史观测状态，不代表当前在线</small></article><article><span>排队 / 运行 / 重试</span><strong>{{summary.active_jobs}}</strong><small>数据库队列与 worker 租约</small></article></section><div class="two-cols"><section class="panel"><h2>近 7 天新增</h2><div class="trend"><div v-for="d in summary.trend" class="trend-column"><b>{{d.count}}</b><meter min="0" :max="maxTrend" :value="d.count"></meter><small>{{d.day.slice(5)}}</small></div></div></section><section class="panel"><h2>开始监控你的目标</h2><ol class="onboarding"><li v-for="(step,i) in onboarding" :key="step.action" :class="{complete:step.done}"><span>{{step.done?'✓':i+1}}</span><button class="text-button" @click="onboardingAction(step)">{{step.label}}</button><small>{{step.done?'已完成':'待完成'}}</small></li></ol><div class="info-box"><b>HTTP 配置与观测结果</b><p>{{overviewHTTPPolicy}}</p></div><button class="secondary" @click="navigate('scope')">进入目标</button></section></div></template>
<template v-if="page==='assets'"><section class="panel"><div class="panel-heading"><h2>资产线索 · {{assetResult.total}}</h2><div class="button-group"><a class="button secondary" :href="exportURL('csv')">CSV</a><a class="button secondary" :href="exportURL('xlsx')">XLSX</a></div></div><div class="filter-grid"><input v-model="filters.q" @input="searchAssets" placeholder="域名 / 标题 / 指纹" aria-label="搜索资产"><select v-model="filters.scope_id" @change="searchAssets" aria-label="筛选目标"><option value="">全部目标</option><option v-for="s in state.scopes" :value="s.id">{{s.domain}}</option></select><select v-model="filters.status" @change="searchAssets"><option value="">全部工作状态</option><option v-for="v in ['new','pending','testing','tested','ignored']" :value="v">{{statusLabel(v)}}</option></select><select v-model="filters.network_category" @change="searchAssets"><option value="">全部网络分类</option><option value="cdn">CDN</option><option value="waf">WAF</option><option value="cloud">云服务</option></select></div><details class="more-filters"><summary>更多筛选</summary><div class="filter-grid"><input v-model="filters.port" @input="searchAssets" placeholder="精确端口，如 443" type="number" min="1" max="65535"><input v-model="filters.service" @input="searchAssets" placeholder="服务，如 https / ssh"><input v-model="filters.favicon_mmh3" @input="searchAssets" placeholder="Favicon mmh3（含零值、负数）" aria-label="图标 mmh3 精确匹配"><input v-model="filters.favicon_sha256" @input="searchAssets" placeholder="Favicon SHA-256" aria-label="图标 SHA-256 精确匹配" maxlength="64"><input v-model="filters.ip" @input="searchAssets" placeholder="精确 IP"><input v-model="filters.status_code" @input="searchAssets" placeholder="HTTP 状态码"><select v-model="filters.source" @change="searchAssets"><option value="">全部来源</option><option v-for="s in assetSourceNames" :value="s">{{s}}</option></select><select v-model="filters.alive" @change="searchAssets"><option value="">全部探测状态</option><option value="true">记录为 HTTP 有响应</option></select><select v-model="filters.security" @change="searchAssets"><option value="">全部设备</option><option value="true">安全设备标记</option></select></div></details>
<details class="saved-views"><summary>保存与使用视图 · {{savedViews.length}}</summary><p class="hint">仅保存在当前浏览器，按账户和项目分别保存。</p><div class="button-group"><span v-for="view in savedViews" :key="view.name" class="view-chip"><button class="text-button" @click="applyAssetView(view)">{{view.name}}</button><button class="text-button" @click="deleteAssetView(view)" :aria-label="'删除视图 '+view.name">×</button></span></div><div class="inline-form"><label>视图名称<input v-model="viewName" maxlength="60" placeholder="如：待测试的云资产"></label><button class="secondary" @click="saveAssetView">保存当前筛选</button></div></details>
<div class="table-wrap"><table><thead><tr><th v-if="canWrite"><input type="checkbox" @change="toggleAll" aria-label="选择本页全部"></th><th class="domain-cell">域名 / 目标</th><th>IP / CNAME</th><th>端口数</th><th>端口 / HTTP</th><th>标题 / 指纹</th><th>分类 / CDN</th><th>状态 / 负责人</th><th>首次 / 最近发现</th></tr></thead><tbody><tr v-for="a in assetResult.items" :key="a.id"><td v-if="canWrite"><input type="checkbox" v-model="selected" :value="a.id" :aria-label="'选择 '+a.host"></td><td class="domain-cell"><button class="text-button mono" @click="showAsset(a.id)">{{a.host}}</button><small class="cell-sub">{{a.domain}}</small></td><td class="mono"><span v-for="ip in a.ips.slice(0,2)" :key="ip" class="ip-line">{{ip}}</span><span v-if="!a.ips.length">—</span><details v-if="a.ips.length>2" class="ip-more"><summary>+{{a.ips.length-2}} 个 IP</summary><span v-for="ip in a.ips.slice(2)" :key="ip" class="ip-line">{{ip}}</span></details><small class="cell-sub">{{a.cnames.slice(0,2).join(', ')}}</small><details v-if="a.cnames.length>2" class="ip-more"><summary>+{{a.cnames.length-2}} 个 CNAME</summary><small class="cell-sub">{{a.cnames.slice(2).join(', ')}}</small></details></td><td>{{a.ports_count??0}}<small class="cell-sub">{{a.services_count??0}} 个服务</small></td><td>{{a.port||'—'}} / {{a.status_code||'无 HTTP 状态码'}}<small class="cell-sub">{{assetHTTPState(a)}}</small></td><td class="title-cell">{{a.title||'—'}}<small class="cell-sub">{{a.fingerprints.join(', ')}}</small></td><td>{{a.category}}<small class="cell-sub">{{a.network_classified_at?(a.network_evidence||[]).map(e=>e.category+':'+e.provider).filter((v,i,a)=>a.indexOf(v)===i).join(' / '):(a.is_cdn?'旧 CDN 标记（未验证）':'')}} {{a.is_security_device?'安全设备':''}}</small></td><td>{{statusLabel(a.status)}}<small class="cell-sub">{{a.assignee||'未分配'}}</small></td><td class="nowrap">{{date(a.first_seen)}}<small class="cell-sub">{{date(a.last_seen)}}</small></td></tr><tr v-if="!assetResult.items.length"><td colspan="9" class="empty">暂无匹配资产。添加目标后执行一次或导入资产。</td></tr></tbody></table></div><div class="pagination"><span>{{assetPage}} / {{pages}} 页 · 共 {{assetResult.total}} 条</span><button class="secondary" :disabled="assetPage<=1" @click="changeAssetPage(assetPage-1)">上一页</button><button class="secondary" :disabled="assetPage>=pages" @click="changeAssetPage(assetPage+1)">下一页</button></div><p class="hint">服务端分页、权限过滤与导出。证书存在不代表服务存活；点击域名查看画像和历史。</p></section><section v-if="canWrite&&selected.length" class="panel"><h2>批量更新 {{selected.length}} 项</h2><div class="filter-grid"><select v-model="bulk.status"><option v-for="v in ['new','pending','testing','tested','ignored']" :value="v">{{statusLabel(v)}}</option></select><input v-model="bulk.assignee" placeholder="负责人，留空保持"><input v-model="bulk.tags" placeholder="标签，逗号分隔"><input v-model="bulk.note" placeholder="备注，留空保持"></div><div class="button-group"><button :disabled="busy" @click="saveBatch">保存所选资产</button><button class="secondary" :disabled="busy" @click="markSecurity(false,true)">标记为非安全设备</button><button class="secondary" :disabled="busy" @click="markSecurity(true,true)">恢复自动判断</button></div></section></template>
<template v-if="page==='scope'">
<section class="panel target-picker"><div class="panel-heading"><h2>目标 · {{state.scopes.length}}</h2><button v-if="canWrite" @click="newScope">添加目标</button></div><label v-if="state.scopes.length">当前目标<select :value="selectedScope" @change="changeTarget($event.target.value)"><option v-for="s in state.scopes" :key="s.id" :value="s.id">{{s.domain}} · {{scopeModeLabel(s.mode)}}{{projects.length>1?' · '+s.project_name:''}}</option></select></label><p v-else-if="!scopeEditorOpen" class="empty">从域名开始添加第一个目标。</p>
<details v-if="state.scopes.length>1"><summary>查看全部目标与计划</summary><div class="table-wrap"><table><thead><tr><th>目标</th><th>资产</th><th>计划 / 下次执行</th><th>操作</th></tr></thead><tbody><tr v-for="s in state.scopes" :key="s.id"><td class="domain-cell">{{s.domain}}<small class="cell-sub">{{scopeModeLabel(s.mode)}}{{projects.length>1?' · '+s.project_name:''}}</small></td><td>{{s.asset_count}}</td><td>{{s.plan?.enabled?'已启用':'未启用'}}<small class="cell-sub">{{s.plan?.enabled?date(s.plan.next_run_at):'—'}}</small></td><td><button class="text-button" @click="changeTarget(s.id)">查看目标</button></td></tr></tbody></table></div></details></section>
<section v-if="scopeEditorOpen&&canWrite" class="panel scope-editor"><div class="panel-heading"><h2>{{scopeForm.id?'编辑目标规则':enterpriseImportCandidate?'将候选转为目标':'添加目标'}}</h2><button class="text-button" @click="scopeEditorOpen=false;enterpriseImportCandidate=null">关闭</button></div>
<form @submit.prevent="saveScope"><label v-if="writableProjects.length>1">所属项目<select v-model.number="scopeForm.project_id" @change="scopePreset!=='custom'&&applyScopePreset(scopePreset)" :disabled="!!scopeForm.id||!!enterpriseImportCandidate"><option :value="0">默认私有项目</option><option v-for="p in writableProjects" :key="p.id" :value="p.id">{{p.name}}</option></select></label>
<label>域名{{scopeForm.id||enterpriseImportCandidate?'':'（支持多个，每行一个）'}}<textarea v-if="!scopeForm.id&&!enterpriseImportCandidate" v-model="scopeForm.domain" rows="3" placeholder="example.com&#10;example.org" required></textarea><input v-else v-model="scopeForm.domain" :readonly="!!enterpriseImportCandidate" required></label>
<label class="checkbox"><input type="checkbox" :checked="scopeForm.mode!=='exact'" @change="scopeForm.mode=$event.target.checked?'descendants':'exact'" :disabled="!!enterpriseImportCandidate">包含全部子域</label><p v-if="scopeForm.mode==='subdomains'" class="hint">当前仅授权子域，不含根域。</p><p v-if="enterpriseImportCandidate" class="hint">已带入企业与项目。首次创建为精确目标，关闭 HTTP 和定时计划；后续可在规则中调整授权。</p>
<details v-if="!enterpriseImportCandidate" class="advanced-scope"><summary>高级设置 · 排除项、执行强度与 HTTP</summary><label>授权粒度<select v-model="scopeForm.mode"><option value="exact">仅此域名</option><option value="descendants">域名及全部子域</option><option value="subdomains">仅子域，不含此域名</option></select></label><p class="hint">*.example.com 按“仅子域”保存。批量目标共用本次规则；每次最多 50 个。</p><label>排除项（每行一个）<textarea v-model="exclusionsText" rows="3" placeholder="login.example.com&#10;*.thirdparty.example.com&#10;192.0.2.0/24"></textarea></label><p class="hint">裸域名仅排除此主机，*.domain 排除其子域；支持 IP/CIDR。</p>
<label>执行强度<select :value="scopePreset" @change="applyScopePreset($event.target.value)"><option value="conservative">保守 · 0.5 RPS / 250 次</option><option value="standard">标准 · 1 RPS / 1000 次</option><option value="aggressive">积极 · 最高 2 RPS / 2000 次</option><option value="custom">自定义</option></select></label><p class="hint">预设受项目合计上限约束，时间窗默认为全天。编辑已有目标时保留原值，只有主动选择预设才应用。</p><div class="filter-grid"><label>目标默认速率（RPS）<input v-model.number="scopeForm.rps" @input="scopePreset='custom'" type="number" min="0.1" max="5" step="0.1" required></label><label>目标并发上限<input v-model.number="scopeForm.concurrency" @input="scopePreset='custom'" type="number" min="1" max="4" required></label><label>每次执行的请求上限<input v-model.number="scopeForm.request_limit" @input="scopePreset='custom'" type="number" min="10" max="10000" required></label></div><p class="hint">项目合计上限 {{scopeProject?.rps_limit||1}} RPS；执行时同时受项目和目标上限约束。外部工具内部请求不计入平台精确请求数。</p><div class="filter-grid"><label>窗口开始（上海时）<input v-model.number="scopeForm.window_start" @input="scopePreset='custom'" type="number" min="0" max="23"></label><label>窗口结束（0–24）<input v-model.number="scopeForm.window_end" @input="scopePreset='custom'" type="number" min="0" max="24"></label></div><label class="checkbox"><input v-model="scopeForm.active" type="checkbox">允许在画像模式下尝试 HTTP 探测（仍受项目策略约束）</label></details>
<label class="checkbox"><input v-model="scopeForm.confirmed" type="checkbox" required>保存前确认：我已获授权，以上域名、子域选择及排除项均在授权内</label><button :disabled="busy">{{scopeForm.id?'保存规则':'保存目标'}}</button></form></section>
<template v-if="selectedScopeDoc&&!scopeEditorOpen"><section class="panel target-heading"><div class="panel-heading"><div><h2>{{selectedScopeDoc.domain}}</h2><p class="hint">{{scopeModeLabel(selectedScopeDoc.mode)}} · {{targetLimits(selectedScopeDoc)}}</p></div><div class="button-group"><button class="secondary" @click="viewTargetAssets">查看资产</button><button class="secondary" @click="viewTargetEvents">查看变化</button><button v-if="scopeCanWrite(selectedScopeDoc)" :disabled="busy||targetPlanDirty||!plan.collectors.length" @click="collect">用默认配置执行一次</button></div></div><p class="hint">{{scopeHTTPPolicy(selectedScopeDoc,plan.collection_mode)}}</p><p v-if="targetPlanDirty" class="hint">当前配置尚未保存；保存后立即执行与定时计划将共用此配置。</p><div class="tabs target-tabs" aria-label="目标详情"><button v-for="t in [['rules','规则'],['sources','数据源'],['plan','计划'],['history','运行历史']]" :key="t[0]" :class="{active:targetTab===t[0]}" @click="changeTargetTab(t[0])">{{t[1]}}</button></div></section>
<section v-if="targetTab==='rules'" class="panel"><div class="panel-heading"><h2>授权与默认执行规则</h2><button v-if="scopeCanWrite(selectedScopeDoc)" class="secondary" @click="editScope(selectedScopeDoc)">编辑规则</button></div><dl class="status-list"><dt>域名与子域</dt><dd>{{selectedScopeDoc.domain}} · {{scopeModeLabel(selectedScopeDoc.mode)}}</dd><dt>执行上限</dt><dd>{{targetLimits(selectedScopeDoc)}}</dd><dt>允许执行时段</dt><dd>{{selectedScopeDoc.window_start}}:00–{{selectedScopeDoc.window_end}}:00（上海时区）</dd><dt>排除项</dt><dd>{{selectedScopeDoc.exclusions?.join('、')||'未设置'}}</dd><dt>HTTP 许可</dt><dd>{{scopeHTTPPolicy(selectedScopeDoc,'profile')}}</dd></dl></section>
<section v-if="targetTab==='sources'" class="panel"><h2>目标默认数据源</h2><p class="hint">此处只配置一次，立即执行和定时计划共用。修改后需保存；不会自动开始执行。</p><fieldset :disabled="!scopeCanWrite(selectedScopeDoc)||busy"><div class="checkbox-row"><label v-for="source in collectorNames" :key="source" class="checkbox"><input type="checkbox" v-model="plan.collectors" :value="source" :disabled="!!sourceBlockReason(source,selectedScopeDoc,plan.collection_mode)" :title="sourceBlockReason(source,selectedScopeDoc,plan.collection_mode)"><span>{{passiveSourceLabel(source)}}<small v-if="sourceBlockReason(source,selectedScopeDoc,plan.collection_mode)" class="cell-sub">{{sourceBlockReason(source,selectedScopeDoc,plan.collection_mode)}}</small></span></label></div><details><summary>高级设置 · 发现后是否解析 / 探测</summary><label>发现后的处理<select v-model="plan.collection_mode" @change="reconcileSourceSelections"><option value="evidence_only">只保存第三方发现（不解析、不探测）</option><option value="profile">继续 DNS 解析 / 画像（HTTP 遵守授权）</option></select></label><p class="hint">仅第三方证据模式不发送平台 DNS/HTTP 请求。画像模式做 DNS，HTTP 还需项目和目标双重允许。多个来源结果合并保留。</p></details></fieldset><p class="hint">FOFA / Hunter 需在设置中绑定账户和积分预算；供应商未返回明确收费时保留待核对。</p><p v-if="sourceWarnings.length" class="notice" role="status">{{sourceWarnings.join('；')}}。已从当前表单移除不兼容项，保存后才会修改已存配置。</p><button v-if="scopeCanWrite(selectedScopeDoc)" :disabled="busy||!plan.collectors.length" @click="savePlan">保存目标配置</button><details v-if="scopeCanWrite(selectedScopeDoc)"><summary>导入已有资产线索</summary><textarea v-model="importHosts" rows="5" placeholder="每行一个域名或 URL"></textarea><div class="button-group"><button class="secondary" :disabled="busy" @click="importAssets(true)">预览分拣</button><button :disabled="busy" @click="importAssets(false)">导入授权范围内</button></div><div v-if="importResult"><p>范围内 {{importResult.in_scope.length}}，拒绝 {{importResult.out_of_scope.length}}</p><p v-for="v in importResult.out_of_scope.slice(0,20)" class="hint">{{v.input}} — {{v.reason}}</p></div></details></section>
<section v-if="targetTab==='plan'" class="panel"><h2>定时计划</h2><p class="hint">使用“数据源”页的目标默认配置：{{plan.collectors.join('、')||'未选择'}}。{{plan.collection_mode==='evidence_only'?'只保存第三方证据':'继续 DNS 解析 / 画像，HTTP 遵守授权'}}。</p><fieldset :disabled="!scopeCanWrite(selectedScopeDoc)||busy"><label class="checkbox"><input v-model="plan.enabled" type="checkbox">启用持续监控</label><label>执行周期<select v-model.number="plan.interval_hours"><option :value="6">每 6 小时</option><option :value="12">每 12 小时</option><option :value="24">每 24 小时</option></select></label><details><summary>高级设置 · 自定义时间</summary><label>cron（上海时区；留空使用周期）<input v-model="plan.cron" placeholder="0 2 * * *"></label></details></fieldset><p class="hint">{{selectedScopeDoc.plan?.enabled?'下次执行：'+date(selectedScopeDoc.plan.next_run_at):'定时计划未启用'}}。最小间隔 5 分钟，已有监控任务时等待结束。</p><p v-if="selectedScopeDoc.plan?.schedule_error" class="notice">计划暂未执行：{{selectedScopeDoc.plan.schedule_error}} · 重试 {{date(selectedScopeDoc.plan.retry_at)}}</p><div v-if="scopeCanWrite(selectedScopeDoc)" class="button-group"><button :disabled="busy" @click="savePlan">保存计划</button><button v-if="selectedScopeDoc.plan?.enabled" class="secondary" :disabled="busy" @click="disablePlan">停用已保存计划</button></div></section>
</template></template>
<section class="panel" v-if="page==='scope'&&targetTab==='history'&&selectedScopeDoc&&!scopeEditorOpen"><h2>当前目标最近 100 次执行</h2><details v-for="j in targetJobs" :key="j.id" class="job-card" :open="runExpanded(j)"><summary class="job-summary"><b>#{{j.id}} {{j.domain}}</b><span class="tag" :class="runOutcome(j).kind">{{runOutcome(j).label}}</span><small>{{date(j.created_at)}} · 新增 {{j.stats?.new||0}} · IP 变化 {{j.stats?.ip_changed||0}}</small><small v-if="runIssueStreak(j)>1">同类问题已连续 {{runIssueStreak(j)}} 次出现</small></summary><div class="panel-heading"><span>{{projectName(j.project_id)}} · 执行详情</span><button v-if="canWrite&&projects.some(p=>p.id===j.project_id&&p.can_write)&&['queued','running','retrying'].includes(j.status)" class="secondary" @click="cancelJob(j.id)" :disabled="busy">取消</button></div><p class="hint">{{j.trigger}} · {{date(j.created_at)}} · 进度 {{j.progress??'未记录'}}{{j.progress==null?'':'%'}} · 尝试 {{j.attempts??'未记录'}}/{{j.max_attempts??'未记录'}} · {{j.worker_id||(['queued','retrying'].includes(j.status)?'待领取':'未记录执行节点')}} · 作业时限 {{j.execution_timeout_seconds?duration(j.execution_timeout_seconds):'未记录'}}<span v-if="j.execution_timeout_seconds">（{{j.execution_timeout_seconds}} 秒）</span> · 截止 {{date(j.deadline_at)}}</p><p v-if="j.waiting_for_worker" class="notice">等待匹配的在线 worker，所需标签：{{j.required_labels.join(', ')||'无'}}。请检查 worker 标签与心跳。</p><p v-if="j.error" class="notice error">{{j.error}}</p><p v-if="j.error_code" class="hint">失败类别：{{failureLabel(j.error_code)}} · {{j.retryable?'临时失败，可手动重试':'不会自动重试'}}</p><p class="notice" :class="{error:runOutcome(j).kind==='failed'}">{{runOutcome(j).reason}}</p><p class="hint">{{runHTTPPolicy(j)}}</p><p v-if="j.stats?.absence_reason" class="hint">缺失判定：{{j.stats.absence_reason}}</p><p v-if="j.stats?.collection_incomplete" class="hint">采集阶段时限已耗尽，后续画像使用单独预算。</p><p v-if="j.stats?.profile_incomplete" class="hint">画像阶段时限已耗尽，已保存部分结果。</p><div class="table-wrap" v-if="j.source_stats?.length"><table><thead><tr><th>来源</th><th>返回</th><th>范围内</th><th>范围外丢弃</th><th>字段过滤</th><th>新增贡献</th><th>尝试</th><th>错误</th></tr></thead><tbody><tr v-for="s in j.source_stats"><td>{{s.source}}</td><td>{{s.returned}}</td><td>{{s.in_scope}}</td><td>{{s.discarded}}</td><td>{{rejectionText(s.rejected_fields)}}</td><td>{{s.new_count}}</td><td>{{s.attempts}}</td><td>{{s.error||'—'}}<small v-if="s.error_code" class="cell-sub">{{failureLabel(s.error_code)}} · {{s.retryable?'允许限次重试':'不可重试'}}</small></td></tr></tbody></table></div><p class="hint">新增 {{j.stats?.new||0}}，更新 {{j.stats?.updated||0}}，泛解析过滤 {{j.stats?.wildcard_filtered||0}}，平台请求 {{j.stats?.requests||0}}/{{j.stats?.budget_limit||'—'}}。subfinder 内部请求由工具限速，不计为平台精确请求数。</p></details><p v-if="!targetJobs.length" class="empty">暂无执行记录</p></section>
<section class="panel" v-if="page==='events'"><div class="panel-heading"><h2>变更时间线</h2><select v-model="eventScope" @change="loadPage" class="search" aria-label="筛选事件目标"><option value="">全部目标</option><option v-for="scope in state.scopes" :key="scope.id" :value="scope.id">{{scope.domain}}</option></select><select v-model="eventType" @change="loadPage" class="search"><option value="">全部事件</option><option v-for="t in ['NEW_ASSET','ASSET_DOWN','ASSET_BACK','IP_CHANGED']" :value="t">{{eventLabel(t)}}</option></select></div><p class="hint">当前被动索引缺失不会判定 HTTP 下线。历史事件保留原始证据；未记录独立 HTTP 依据的记录明确标为历史状态变化。相同事件按天去重。</p><div class="table-wrap"><table><thead><tr><th>事件</th><th>资产 / 范围</th><th>详情</th><th>执行 / 时间</th></tr></thead><tbody><tr v-for="v in events"><td>{{eventLabel(v.type)}}</td><td class="mono">{{v.host}}<small class="cell-sub">{{v.domain}}</small></td><td>{{eventSummary(v)}}<details><summary>查看原始证据</summary><pre>{{JSON.stringify(v.detail,null,2)}}</pre></details></td><td>{{v.job_id?'#'+v.job_id:'未关联运行'}}<small class="cell-sub">{{date(v.created_at)}}</small></td></tr><tr v-if="!events.length"><td colspan="4" class="empty">暂无事件</td></tr></tbody></table></div></section>
<template v-if="page==='programs'"><div class="src-grid"><a v-for="p in state.src" :href="p.url" target="_blank" rel="noopener noreferrer" class="src-card"><b>{{p.name}} ↗</b><p>{{p.note}}</p></a></div><section class="panel"><h2>当前能力</h2><p>crt.sh / CertSpotter 证书源、subfinder、基础 DNS、可控 HTTP 画像、监控队列、变化事件与每日摘要。</p><p class="hint">尚未接入商业 API、端口扫描、网页截图、漏洞扫描。插件页显示当前实际可用能力，不自动扩大范围。</p></section></template>
<template v-if="page==='mail'"><div class="two-cols"><section class="panel"><h2>SMTP 设置</h2><p class="hint">AES-GCM 加密保存；密码留空保持原值。当前 8080 为 HTTP，建议使用 SSH 隧道配置授权码。</p><form @submit.prevent="saveSMTP"><label>主机<input v-model="smtp.host" placeholder="smtp.example.com" required></label><div class="filter-grid"><label>端口<input v-model.number="smtp.port" type="number" min="1" max="65535" required></label><label>传输加密<select v-model="smtp.mode"><option value="starttls">STARTTLS</option><option value="tls">TLS / SSL</option></select></label></div><label>账号<input v-model="smtp.username" autocomplete="off"></label><label>密码 / 授权码<input v-model="smtp.password" type="password" autocomplete="new-password" :placeholder="smtp.password_set?'已保存，留空保持':'尚未配置'"></label><label>发件地址<input v-model="smtp.from" type="email" required></label><label>授权收件人（每行一个）<textarea v-model="recipientText" rows="3" required></textarea></label><label>每日发送时间（上海时区）<input v-model="smtp.time" type="time" required></label><label>摘要范围（不选表示全部）<select v-model="smtp.scope_ids" multiple><option v-for="s in state.scopes" :value="s.id">{{s.domain}}</option></select></label><label class="checkbox"><input v-model="smtp.enabled" type="checkbox">启用每日摘要</label><label class="checkbox"><input v-model="smtp.send_empty" type="checkbox">无变化也发送空报告</label><button :disabled="busy">加密保存（不发送）</button></form></section><section class="panel"><h2>预览与投递</h2><p class="muted">新增资产最多展示 50 条，含失败任务及到期提醒。同日同范围组合不会重复发送。</p><div class="button-stack"><button class="secondary" :disabled="busy" @click="previewDigest">预览今日摘要（不发送）</button><button class="secondary" :disabled="busy" @click="sendMail(true)">向配置收件人发送测试邮件</button><button :disabled="busy" @click="sendMail(false)">发送今日摘要</button></div><p class="hint">最多重试 3 次；SMTP 最终应答不确定时需人工核对，不自动重发。</p><iframe v-if="mailPreview" class="mail-preview" :srcdoc="mailPreview" sandbox="" title="摘要预览"></iframe></section></div><section class="panel"><h2>投递记录</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>状态</th><th>次数</th><th>幂等键</th><th>错误</th></tr></thead><tbody><tr v-for="l in mailLogs"><td>{{date(l.created_at)}}</td><td>{{statusLabel(l.status)}}</td><td>{{l.attempts}}</td><td class="mono">{{l.idempotency_key}}</td><td>{{l.error||'—'}}</td></tr><tr v-if="!mailLogs.length"><td colspan="5" class="empty">暂无投递记录</td></tr></tbody></table></div></section></template>

<template v-if="page==='passive'">
<section class="panel"><h2>被动资产发现账户</h2><p class="hint">与证书源并列，用于取得第三方历史证据。默认仅使用积分 / 免费额度，不提供充值或购买入口。每次资产查询前核对余额；无法排除付费回退时停止。每个账户单独记账，显式绑定一个项目；每个项目每个供应商只选定一个账户。限流后冷却，不自动换号。保存配置不触发供应商请求。</p><p v-for="p in passiveProviders">{{p.name}} · {{p.available?'适配器可配置':'尚不可用'}} · {{p.note}}</p>
<div class="table-wrap"><table><thead><tr><th>账户 / 项目</th><th>状态</th><th>已用 / 预留</th><th>操作</th></tr></thead><tbody><tr v-for="a in passiveAccounts" :key="a.id"><td>#{{a.id}} {{a.name}} · {{a.source}}<small class="cell-sub">{{projectName(a.project_id)}} · {{a.enabled?'启用':'停用'}} · {{a.selected?'项目选定':'未选定'}}</small></td><td>{{passiveLabel(a.state)}}<small class="cell-sub">冷却至 {{date(a.cooldown_until)}} · {{a.key_set?'已设置密钥':'未设置'}}</small><small class="cell-sub">仅积分 · 每页 {{a.page_size}} 条</small><small class="cell-sub">已查积分 {{a.credit_snapshot?.credits??'未知'}} · 每日额度 {{a.credit_snapshot?.daily_credits??'未提供'}} / 付费余额 {{a.credit_snapshot?.paid_balance??'未知'}} · {{date(a.credit_snapshot?.checked_at)}}</small></td><td><template v-for="b in passiveBudgets.filter(b=>b.account_id===a.id)"><div>请求 {{b.requests_used}} / 预约 {{b.requests_reserved}} · 上限 {{b.request_limit}}</div><div>返回 {{b.records_returned}} / 预留 {{b.records_reserved}} · 上限 {{b.record_limit}}</div><div>{{b.charge_unit}} 已用 {{b.units_used}} / 预留 {{b.units_reserved}} · 上限 {{b.unit_limit}}</div><small class="cell-sub">有效至 {{date(b.window_end)}}，不自动重置</small></template></td><td><button class="text-button" @click="editPassiveAccount(a)">编辑</button><button class="text-button" :disabled="busy" @click="checkPassiveAccount(a)">检查积分余额</button><button class="text-button" @click="editPassiveBudget(a)">预算</button><button v-if="['unavailable','rate_limited'].includes(a.state)" class="text-button" @click="recoverPassiveAccount(a)">恢复状态</button></td></tr><tr v-if="!passiveAccounts.length"><td colspan="4">尚未配置账户。</td></tr></tbody></table></div></section>
<section class="panel"><h2>Hunter 多账户积分</h2><form @submit.prevent="importPassiveAccounts"><label>绑定项目<select v-model.number="passiveBatchForm.project_id" :disabled="busy" required><option :value="0" disabled>请选择</option><option v-for="p in projects" :value="p.id">{{p.name}}</option></select></label><label>账户名称前缀<input v-model="passiveBatchForm.prefix" maxlength="40" :disabled="busy"></label><label>批量 API Key（每行一个，最多 50 个；提交后清空）<textarea v-model="passiveBatchForm.keys" rows="4" autocomplete="off" spellcheck="false" :disabled="busy" required style="-webkit-text-security:disc"></textarea></label><p class="hint">逐账户保存加密密钥；同一项目的重复密钥跳过。新增账户默认停用、未选定，不自动创建预算。按账户配置独立预算并显式选定后才能采集。不会合并成共享积分池，不自动换号续查。</p><div class="button-group"><button :disabled="busy">批量加密保存</button><button type="button" class="secondary" :disabled="busy||!passiveBatchForm.project_id" @click="checkPassiveBatch">逐个检查本项目 Hunter 积分（最多 50 个）</button></div><p class="hint">检查只读取账户信息；串行执行，任何错误或冷却状态都停止后续检查。每日额度按账户返回值展示，不假定重置时间。</p></form></section>
<div class="two-cols"><section class="panel"><div class="panel-heading"><h2>{{passiveAccountForm.id?'编辑账户':'新增账户'}}</h2><button class="text-button" @click="newPassiveAccount">清空</button></div><form @submit.prevent="savePassiveAccount"><label>项目<select v-model.number="passiveAccountForm.project_id" :disabled="!!passiveAccountForm.id" required><option :value="0" disabled>请选择</option><option v-for="p in projects" :value="p.id">{{p.name}}</option></select></label><label>来源<select v-model="passiveAccountForm.source" :disabled="!!passiveAccountForm.id"><option value="hunter">奇安信 Hunter</option><option value="fofa">FOFA</option></select></label><label>使用方式<select v-model="passiveAccountForm.billing_policy"><option value="credits_only">仅使用积分 / 免费额度，禁止付费余额回退</option></select></label><label>每页条数<select v-if="passiveAccountForm.source==='hunter'" v-model.number="passiveAccountForm.page_size"><option :value="10">10</option><option :value="20">20</option><option :value="50">50</option><option :value="100">100</option></select><input v-else type="number" v-model.number="passiveAccountForm.page_size" min="1" max="100"></label><label>账户名称<input v-model="passiveAccountForm.name" maxlength="100" required></label><label>API Key（只写，留空保留已有值）<input v-model="passiveAccountForm.key" type="password" autocomplete="new-password" :required="!passiveAccountForm.id" maxlength="8192"></label><label class="checkbox"><input type="checkbox" v-model="passiveAccountForm.enabled">启用</label><label class="checkbox"><input type="checkbox" v-model="passiveAccountForm.selected" :disabled="!passiveAccountForm.enabled">显式选为该项目的来源账户</label><label class="checkbox"><input type="checkbox" v-model="passiveAccountForm.provider_time_enabled" :disabled="passiveAccountForm.source!=='fofa'">已核实此账户有 lastupdatetime 字段权限，附带请求供应商更新时间</label><p class="hint">默认不请求需要额外权限的时间字段；未取得时间保留未知，不在收费失败后自动降级重查。</p><p class="hint">密钥不回显。待核对请求必须先结算；更换项目或供应商须新建账户。</p><button :disabled="busy">加密保存账户</button></form></section>
<section v-if="passiveBudgetForm" class="panel"><h2>账户 #{{passiveBudgetForm.account_id}} 独立预算</h2><form @submit.prevent="savePassiveBudget"><p class="hint">按已核实的账户能力手工填写。到期停止，不假定每日重置或默认积分数。同一窗口保留已用量；新窗口不能重叠。预算预留上限不代表实际收费。</p><label>窗口开始（UTC）<input type="datetime-local" v-model="passiveBudgetForm.window_start" required></label><label>窗口结束（UTC）<input type="datetime-local" v-model="passiveBudgetForm.window_end" required></label><label>余额核实时间（UTC）<input type="datetime-local" v-model="passiveBudgetForm.balance_as_of" required></label><label>供应商重置时区（未核实时保留 unconfirmed）<input v-model="passiveBudgetForm.timezone" required></label><label>请求次数上限<input type="number" v-model.number="passiveBudgetForm.request_limit" min="1" max="1000000" required></label><label>返回条数上限<input type="number" v-model.number="passiveBudgetForm.record_limit" min="1" max="10000000" required></label><label>收费单位<select v-model="passiveBudgetForm.charge_unit"><option value="points">积分</option></select></label><label>收费单位预算上限<input type="number" v-model.number="passiveBudgetForm.unit_limit" min="1" max="1000000000" required></label><label>每页预留单位上限（人工确认，非实际扣费）<input type="number" v-model.number="passiveBudgetForm.reserve_units_per_page" min="1" max="1000000000" required></label><label>核实依据（不填写密钥或含密钥的地址）<input v-model="passiveBudgetForm.policy_reference" maxlength="1000" required></label><button :disabled="busy">保存已核实预算</button></form></section></div>
<section class="panel"><h2>查询与费用账本</h2><p class="hint">请求次数、返回条数、收费单位分别记录。未知显示“待核对”，不按一次请求等于一积分。原任务结束后才能人工结算；结算不会重新发出查询。</p><div class="table-wrap"><table><thead><tr><th>账户 / 任务</th><th>查询 / 分页</th><th>请求 / 返回</th><th>费用</th><th>状态 / 操作</th></tr></thead><tbody><tr v-for="q in passiveQueries" :key="q.id"><td>#{{q.account_id}} {{q.source}}<small class="cell-sub">任务 #{{q.job_id}} · {{date(q.created_at)}}</small></td><td>{{q.query}}<small class="cell-sub">第 {{q.page}} 页 · 每页上限 {{q.page_size}} · {{q.query_complete?'查询完成元数据已核对':'查询完整性未确认'}}</small></td><td>{{q.request_count}} / {{q.returned_count===null?'未知':q.returned_count}}</td><td>{{q.actual_units===null?'待核对':q.actual_units}} {{q.charge_unit}}<small class="cell-sub">预留 {{q.reserved_units}} · 上游剩余 {{q.provider_remaining===null?'未知':q.provider_remaining}}</small></td><td>{{passiveLabel(q.state)}} / {{passiveLabel(q.status)}}<small class="cell-sub">{{failureLabel(q.error_code)}}</small><button v-if="q.state==='pending_reconciliation'" class="text-button" @click="startPassiveReconcile(q)">人工核对</button></td></tr><tr v-if="!passiveQueries.length"><td colspan="5">尚无查询；保存设置不会生成收费请求。</td></tr></tbody></table></div><div class="button-group"><button class="secondary" :disabled="busy||passiveQueryPage<=1" @click="passiveQueryPageChange(-1)">上一页</button><span>第 {{passiveQueryPage}} 页</span><button class="secondary" :disabled="busy||passiveQueries.length<50" @click="passiveQueryPageChange(1)">下一页</button></div></section>
<section v-if="passiveReconcileForm" class="panel"><h2>人工核对请求 #{{passiveReconcileForm.id}}</h2><form @submit.prevent="reconcilePassive"><label>实际收费单位数（未知不可填 0）<input type="number" v-model.number="passiveReconcileForm.actual_units" min="0" max="1000000000" required></label><label>实际返回条数（未知不可填 0）<input type="number" v-model.number="passiveReconcileForm.returned_count" min="0" max="10000" required></label><label class="checkbox"><input type="checkbox" v-model="passiveReconcileForm.confirmed" required>已在供应商账户核实实际收费及返回条数，并确认按真实数值结算</label><button :disabled="busy">确认结算，不重新查询</button></form></section>
</template>

<template v-if="page==='plugins'"><section class="panel"><h2>插件管理</h2><p class="hint">从服务器 plugins/*.yaml 加载。新增配置后重启服务，再在此启用；内置证书源继续可用。</p><div class="table-wrap"><table><thead><tr><th>名称 / 版本</th><th>类型 / 状态</th><th>健康 / 标签</th><th>说明 / 计划引用</th><th>操作</th></tr></thead><tbody><tr v-for="p in plugins" :key="p.name"><td>{{p.name}}<small class="cell-sub">{{p.version||'内置'}}</small></td><td>{{p.kind}} / {{p.mode}}<small class="cell-sub">{{p.enabled?'启用':'停用'}}</small></td><td>{{p.available?'可用':p.health||'不可用'}}<small class="cell-sub">{{(p.required_labels||[]).join(', ')||'无标签要求'}}</small></td><td>{{p.note}}<small class="cell-sub">引用计划 {{p.plan_count||0}} · 已启用 {{p.enabled_plan_count||0}}</small></td><td><button v-if="p.mode==='external'" class="text-button" @click="editPlugin(p)">配置与测试</button></td></tr></tbody></table></div></section><section v-if="pluginEditor" class="panel"><div class="panel-heading"><h2>{{pluginEditor.name}} · 参数与测试</h2><button class="secondary" @click="pluginEditor=null">关闭</button></div><div class="info-box"><b>引用此插件的监控计划：{{pluginEditor.plan_count||0}} 个，已启用 {{pluginEditor.enabled_plan_count||0}} 个</b><p v-if="!pluginEditor.enabled&&pluginEditor.savedEnabled&&pluginEditor.enabled_plan_count" class="notice">保存停用后，以下已启用计划将报告插件停用并等待配置修复；请按需替换计划来源。</p><ul v-if="pluginEditor.plan_references?.length"><li v-for="ref in pluginEditor.plan_references" :key="ref.scope_id">{{ref.domain}} · 用户 {{ref.owner}} · {{ref.enabled?'计划已启用':'计划未启用'}} · 下次 {{date(ref.next_run_at)}}</li></ul><p v-else class="hint">暂无引用计划。</p></div><form @submit.prevent="savePlugin"><label class="checkbox"><input type="checkbox" v-model="pluginEditor.enabled">启用此插件</label><div v-for="(param,key) in pluginEditor.params" :key="key"><label>{{key}}<select v-if="param.enum?.length" v-model="pluginEditor.values[key]"><option v-for="v in param.enum" :value="v">{{v}}</option></select><input v-else-if="param.type==='boolean'" type="checkbox" v-model="pluginEditor.values[key]"><input v-else-if="['integer','number'].includes(param.type)" v-model.number="pluginEditor.values[key]" type="number" min="0" :max="param.max||undefined" :step="param.type==='integer'?1:'any'"><input v-else-if="param.type==='string_array'" :value="(pluginEditor.values[key]||[]).join(',')" @input="pluginEditor.values[key]=$event.target.value.split(',').map(v=>v.trim()).filter(Boolean)" placeholder="逗号分隔"><input v-else v-model="pluginEditor.values[key]" :maxlength="param.max||undefined"></label></div><p v-if="!Object.keys(pluginEditor.params||{}).length" class="hint">此插件没有可修改的默认参数。</p><button :disabled="busy">保存配置</button></form><hr><h3>测试运行</h3><p v-if="pluginConfigDirty" class="notice">有未保存的修改，请先保存后再测试。</p><p v-else-if="!pluginEditor.savedEnabled" class="hint">服务器尚未启用此插件。</p><p class="hint">只允许当前管理员自己拥有的有效范围。测试结果仅展示，不写入资产。</p><form @submit.prevent="testPlugin"><label>我的范围<select v-model="pluginTest.scope_id" required><option value="">请选择</option><option v-for="s in ownScopes" :value="s.id">{{s.domain}}</option></select></label><label>示例域名<input v-model="pluginTest.target" required placeholder="已授权的 example.com 或子域"></label><button :disabled="busy||!pluginCanTest">运行测试</button></form><p v-if="pluginTestJob">任务 #{{pluginTestJob}} · {{pluginTestStatus}}</p><button class="text-button" @click="refreshPluginTest">刷新运行结果</button><article v-for="run in pluginRuns" :key="run.id" class="job-card"><b>运行 #{{run.id}} · 任务 #{{run.job_id}} · {{run.finished_at?(run.error?'失败':'成功'):'运行中'}}</b><p class="hint">{{date(run.started_at)}} · 返回 {{run.returned}} / 范围内 {{run.in_scope}} / 新增 {{run.new_count}} · 退出码 {{run.exit_code??'—'}}</p><p v-if="run.rejected_fields?.malformed_jsonl" class="hint">格式错误行 {{run.rejected_fields.malformed_jsonl}}；超过 20 行或最终比例超过 10% 时，本次执行失败，结果不写入资产。</p><p v-if="run.error" class="notice error">{{run.error}}</p><p v-if="run.error_code" class="hint">{{failureLabel(run.error_code)}} · {{run.retryable?'允许限次重试':'不可重试'}}</p><details v-if="run.stderr_excerpt"><summary>执行诊断（已截断和脱敏）</summary><pre>{{run.stderr_excerpt}}</pre></details><div class="table-wrap"><table><thead><tr><th>解析目标 / 来源</th><th>IP</th><th>端口 / 协议</th><th>HTTP</th><th>标题 / Server</th><th>证据类型</th></tr></thead><tbody><tr v-for="(record,i) in run.output_sample" :key="i"><td class="mono">{{record.candidate.host}}<small class="cell-sub">{{record.candidate.source}}</small></td><td class="mono">{{record.observation?.ips?.join(', ')||'—'}}</td><td>{{record.observation?.port||'未提供'}}<small class="cell-sub">{{record.observation?.services?.[0]?.protocol||'—'}}</small></td><td>{{record.observation?.status_code||'—'}}</td><td>{{record.observation?.title||'—'}}<small class="cell-sub">{{record.observation?.server}}</small></td><td>{{record.observation?'插件画像，不代表当前存活':'候选域名'}}</td></tr><tr v-if="!run.output_sample?.length"><td colspan="6" class="empty">暂无解析样例。</td></tr></tbody></table></div></article></section></template>
<template v-if="page==='security-rules'"><div class="two-cols"><section class="panel"><div class="panel-heading"><h2>{{ruleForm.id?'编辑规则 #'+ruleForm.id:'新增安全设备规则'}}</h2><button class="text-button" @click="newSecurityRule">清空</button></div><form @submit.prevent="saveSecurityRule"><label>关键词 / 正则<input v-model="ruleForm.keyword" maxlength="512" required></label><label>匹配方式<select v-model="ruleForm.match"><option value="contains">包含（忽略大小写）</option><option value="regex">正则（Go RE2）</option></select></label><label>匹配字段</label><div class="checkbox-row"><label class="checkbox" v-for="f in ['title','server','tls','fingerprint']"><input type="checkbox" v-model="ruleForm.fields" :value="f">{{f}}</label></div><label class="checkbox"><input type="checkbox" v-model="ruleForm.enabled">启用</label><button :disabled="busy||!ruleForm.fields.length">保存规则</button></form></section><section class="panel"><h2>判断说明</h2><p>命中只添加设备标记，资产仍然保留，正常采集画像。</p><p>关键词与范围注册域主标签完全相同时忽略该规则。例如 sangfor.com 范围跳过 sangfor 规则。</p><p class="hint">规则每 60 秒刷新；删除或修改后，历史命中证据保留。已有资产在下次成功 HTTP 画像时重新判断，可在详情中人工纠正。</p></section></div><section class="panel"><h2>规则列表 · {{securityRules.length}}</h2><div class="table-wrap"><table><thead><tr><th>ID / 来源</th><th>关键词</th><th>方式 / 字段</th><th>状态</th><th>操作</th></tr></thead><tbody><tr v-for="r in securityRules" :key="r.id"><td>#{{r.id}}<small class="cell-sub">{{r.builtin?'内置':'自定义'}}</small></td><td class="mono">{{r.keyword}}</td><td>{{r.match}}<small class="cell-sub">{{r.fields.join(', ')}}</small></td><td>{{r.enabled?'启用':'停用'}}</td><td><button class="text-button" :disabled="busy" @click="editSecurityRule(r)">编辑</button> <button class="text-button" :disabled="busy" @click="toggleSecurityRule(r)">{{r.enabled?'停用':'启用'}}</button> <button class="text-button" :disabled="busy" @click="deleteSecurityRule(r)">删除</button></td></tr><tr v-if="!securityRules.length"><td colspan="5" class="empty">暂无规则</td></tr></tbody></table></div></section></template>
<template v-if="page==='blacklist'"><section class="panel"><h2>添加黑名单</h2><form class="inline-form" @submit.prevent="addBlacklist"><label>域名 / IP / CIDR<input v-model="blackForm.pattern" placeholder="example.net 或 192.0.2.0/24" required></label><label>备注<input v-model="blackForm.note"></label><button :disabled="busy">添加</button></form><p class="hint">裸域名包括其全部子域。黑名单优先于范围排除与授权，worker 每次操作前检查。</p></section><section class="panel"><table><thead><tr><th>目标</th><th>备注</th><th>操作</th></tr></thead><tbody><tr v-for="b in blacklist"><td class="mono">{{b.pattern}}</td><td>{{b.note}}</td><td><button class="text-button" @click="removeBlacklist(b.id)">移除</button></td></tr><tr v-if="!blacklist.length"><td colspan="3" class="empty">暂无自定义黑名单。主动连接仍默认拒绝私有、回环与保留 IP。</td></tr></tbody></table></section></template>
<template v-if="page==='users'"><section class="panel"><h2>创建用户</h2><form class="inline-form" @submit.prevent="createUser"><label>用户名<input v-model="newUser.name" pattern="[a-zA-Z0-9_-]{3,32}" required></label><label>初始密码<input v-model="newUser.password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>角色<select v-model="newUser.role"><option value="user">成员</option><option value="readonly">只读</option><option value="admin">管理员</option></select></label><button :disabled="busy">创建用户</button></form></section><section class="panel"><table><thead><tr><th>用户</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody><tr v-for="u in users"><td>{{u.name}}</td><td>{{role(u.role)}}</td><td>{{u.disabled?'停用':'正常'}}</td><td><button class="text-button" @click="editUser(u)">管理</button> <button class="text-button" :disabled="busy" @click="unlockLogin(u)">解除登录限制</button></td></tr></tbody></table></section></template>
<section class="panel" v-if="page==='logs'"><h2>访问与登录日志</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>用户</th><th>来源 IP</th><th>请求</th><th>状态</th><th>耗时</th></tr></thead><tbody><tr v-for="(l,i) in logs" :key="i"><td class="nowrap">{{date(l.time)}}</td><td>{{l.user}}</td><td class="mono">{{l.ip}}</td><td class="mono">{{l.method}} {{l.path}}</td><td>{{l.status}}</td><td>{{l.ms}} ms</td></tr></tbody></table></div><p class="hint">显示最近 500 条，不记录请求正文、密码、密钥或后台轮询。</p></section>
<template v-if="page==='status'&&status"><section class="stats"><article><span>1 分钟负载</span><strong>{{status.load.split(' ')[0]}}</strong><small>{{status.cpus}} 个逻辑 CPU，非利用率</small></article><article><span>系统内存</span><strong>{{percent(status.memory_total-status.memory_available,status.memory_total)}}%</strong><small>可用 {{bytes(status.memory_available)}}</small></article><article><span>磁盘使用</span><strong>{{percent(status.disk_total-status.disk_available,status.disk_total)}}%</strong><small>可用 {{bytes(status.disk_available)}}</small></article><article><span>服务运行</span><strong class="duration">{{duration(status.service_uptime)}}</strong><small>{{status.go}}</small></article></section><section class="panel"><h2>数据库与 worker</h2><p>{{status.storage}}</p><table><thead><tr><th>节点</th><th>版本</th><th>并发</th><th>当前任务</th><th>心跳</th></tr></thead><tbody><tr v-for="w in status.workers||[]"><td class="mono">{{w.id}}</td><td>{{w.version}}</td><td>{{w.concurrency}}</td><td>{{w.active_jobs}}</td><td>{{date(w.heartbeat_at)}}</td></tr></tbody></table><p class="hint">会话 {{status.sessions}} · Go 堆 {{bytes(status.process_memory)}} · Goroutine {{status.goroutines}} · {{status.hostname}}</p></section></template>
<section class="panel account" v-if="page==='account'"><h2>修改我的密码</h2><form @submit.prevent="changePassword"><label>当前密码<input v-model="passwordForm.current" type="password" autocomplete="current-password" required></label><label>新密码<input v-model="passwordForm.password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>确认新密码<input v-model="passwordConfirm" type="password" minlength="12" autocomplete="new-password" required></label><button :disabled="busy">更新密码</button></form></section><footer><span>ScopeDesk · Go + Vue 3 / PostgreSQL</span><span>授权 → 发现 → 变化 → 通知</span></footer></main>
<div class="modal-backdrop" v-if="editing" @click.self="editing=null"><section class="modal" role="dialog" aria-modal="true"><h2>管理 {{editing.name}}</h2><form @submit.prevent="updateUser"><label>角色<select v-model="editing.role" :disabled="editing.id===me.id"><option value="user">成员</option><option value="readonly">只读</option><option value="admin">管理员</option></select></label><label class="checkbox"><input v-model="editing.disabled" type="checkbox" :disabled="editing.id===me.id">停用账户</label><label>重置密码（留空保持）<input v-model="editing.password" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label><p v-if="isError" class="notice error">{{message}}</p><div class="modal-actions"><button class="secondary" type="button" @click="editing=null">取消</button><button :disabled="busy">保存</button></div></form></section></div>
<div class="modal-backdrop" v-if="detail" @click.self="detail=null"><section class="modal asset-modal" role="dialog" aria-modal="true"><div class="panel-heading"><h2>{{detail.asset.host}}</h2><button class="secondary" @click="detail=null">关闭</button></div><dl class="status-list"><dt>分类 / 评分</dt><dd>{{detail.asset.category}} · {{detail.asset.score}}<template v-if="detail.asset.classification"><p class="hint">{{detail.asset.classification.mode==='manual'?'人工分类优先':'自动分类'}} · 规则 {{detail.asset.classification.version}} · 根域 {{detail.asset.classification.root||'不适用'}}</p><p class="hint">自动命中：{{detail.asset.classification.keyword||'无'}}<span v-if="detail.asset.classification.label">（标签 {{detail.asset.classification.label}}）</span>；基础 {{detail.asset.classification.base_points}} + 关键词 {{detail.asset.classification.keyword_points}} + HTTP 存活 {{detail.asset.classification.alive_points}}。评分仅供排序，不是漏洞或归属置信度。</p></template><p v-else class="hint">历史分类来源未知，保留原值；主动恢复自动分类后按当前规则计算。</p><div v-if="canWrite&&scopeCanWrite(state.scopes.find(s=>s.id===detail.asset.scope_id))"><label>人工分类<input v-model="categoryDraft" maxlength="128" placeholder="输入分类名称"></label><div class="button-group"><button class="secondary" :disabled="busy||!categoryDraft.trim()" @click="saveCategory(false)">保存人工分类</button><button class="secondary" :disabled="busy" @click="saveCategory(true)">恢复自动分类</button></div></div></dd><dt>DNS 最近观测</dt><dd v-if="detail.asset.dns_observation">{{dnsStateLabel(detail.asset.dns_observation.state)}} · {{date(detail.asset.dns_observation.observed_at)}}<small class="cell-sub">解析器响应证据；单次负面结果不代表 HTTP 站点下线。</small></dd><dd v-else>未取得独立 DNS 响应证据</dd><dt>IP / CNAME</dt><dd>{{detail.asset.ips.join(', ')}} / {{detail.asset.cnames.join(', ')}}</dd><dt>标题 / Server</dt><dd>{{detail.asset.title}} / {{detail.asset.server}}</dd><dt>TLS 主体 / 到期</dt><dd>{{detail.asset.tls_subject}} / {{date(detail.asset.tls_not_after)}}</dd><dt>图标 mmh3（已验证）</dt><dd><button v-if="hashPresent(detail.asset.favicon_mmh3)" class="text-button mono" @click="filterFavicon('favicon_mmh3',detail.asset.favicon_mmh3)">{{detail.asset.favicon_mmh3}}</button><span v-else>未取得</span></dd><dt>图标 SHA-256（已验证）</dt><dd><button v-if="hashPresent(detail.asset.favicon_sha256)" class="text-button mono" @click="filterFavicon('favicon_sha256',detail.asset.favicon_sha256)">{{detail.asset.favicon_sha256}}</button><span v-else>未取得</span></dd><dt>旧哈希（未验证）</dt><dd class="mono">{{detail.asset.favicon_hash||'未取得'}}</dd><dt>安全设备命中</dt><dd><span>{{detail.asset.is_security_device?'安全设备':'未标记为安全设备'}}</span><p v-if="detail.asset.security_device_override===false" class="hint">人工确认：非安全设备；保留自动命中证据。</p><p v-for="hit in (detail.asset.security_matches||[])" :key="hit.rule_id">规则 #{{hit.rule_id}} · {{hit.keyword}} · {{hit.match}} · 字段：{{hit.fields.join(', ')}}</p><p v-if="!detail.asset.security_matches?.length" class="hint">{{detail.asset.security_rule||'无命中规则'}}</p><div v-if="canWrite" class="button-group"><button class="secondary" :disabled="busy" @click="markSecurity(false)">标记为非安全设备</button><button class="secondary" :disabled="busy" @click="markSecurity(true)">恢复自动判断</button></div></dd><dt>标签 / 备注</dt><dd>{{detail.asset.tags.join(', ')}} / {{detail.asset.note}}</dd></dl><h3>服务 · {{(detail.services||[]).length}}</h3><div class="table-wrap"><table><thead><tr><th>IP / 端口</th><th>协议 / 服务</th><th>HTTP / 标题</th><th>指纹 / Server</th><th>图标哈希</th><th>TLS / 到期</th><th>首次 / 最近</th></tr></thead><tbody><tr v-for="svc in (detail.services||[])" :key="svc.id"><td class="mono">{{svc.ip||'IP 未知'}}:{{svc.port}}</td><td>{{svc.protocol}} / {{svc.service||'未知'}}<small class="cell-sub">{{svc.scheme}}</small><small v-if="svc.evidence_only" class="cell-sub">插件画像：{{svc.source}}，不代表当前存活</small></td><td>{{svc.status_code||'—'}} / {{svc.title||'—'}}<small class="cell-sub">{{svc.banner}}</small></td><td>{{(svc.fingerprints||[]).map(f=>typeof f==='string'?f:(f?.name||'未知')).join(', ')}}<small class="cell-sub">{{svc.server}}</small><small v-for="(hit,i) in (svc.fingerprint_evidence||[])" :key="i" class="cell-sub">{{hit.product}} · {{hit.confidence}}/100 · {{hit.matches.map(m=>m.field+(m.negated?' 不包含 ':' 匹配 ')+m.pattern).join(' / ')}} · {{hit.source}} @ {{hit.version}}</small></td><td class="mono"><button v-if="hashPresent(svc.favicon_mmh3)" class="text-button mono" @click="filterFavicon('favicon_mmh3',svc.favicon_mmh3)">{{svc.favicon_mmh3}}</button><span v-else>未取得</span><small class="cell-sub"><button v-if="hashPresent(svc.favicon_sha256)" class="text-button mono" @click="filterFavicon('favicon_sha256',svc.favicon_sha256)">{{svc.favicon_sha256}}</button></small><small v-if="svc.favicon_legacy_sha256" class="cell-sub">旧哈希（未验证）：{{svc.favicon_legacy_sha256}}</small></td><td>{{svc.tls_subject||'—'}}<small class="cell-sub">{{date(svc.tls_not_after)}}</small></td><td>{{date(svc.first_seen)}}<small class="cell-sub">{{date(svc.last_seen)}} · 缺失 {{svc.miss_count}}</small></td></tr><tr v-if="!detail.services?.length"><td colspan="7" class="empty">暂无服务画像；后续授权探测会补充。</td></tr></tbody></table></div><h3>被动指纹依据</h3><p v-if="!detail.asset.fingerprint_evidence?.length" class="hint">暂无新引擎命中依据；历史名称不代表已按新规则验证。</p><div v-for="(hit,i) in (detail.asset.fingerprint_evidence||[])" :key="i"><b>{{hit.product}} · 置信度 {{hit.confidence}}/100</b><p v-for="(m,j) in hit.matches" :key="j">{{m.field}} {{m.key||''}} · {{m.negated?'不包含':'匹配'}} {{m.pattern}} · 依据 {{m.value}}</p><small>{{hit.source}} @ {{hit.version}}</small></div><h3>网络分类证据</h3><p v-if="!detail.asset.network_classified_at" class="hint">尚未按新规则分类，旧 CDN 标记未验证。</p><p v-for="(hit,i) in (detail.asset.network_evidence||[])" :key="i">{{hit.category}} / {{hit.provider}} · {{hit.type}}：{{hit.value}} · 命中 {{hit.rule}}<small class="cell-sub">{{hit.source}} @ {{hit.version}}</small></p><h3>插件画像证据 · {{(detail.asset.plugin_evidence||[]).length}}</h3><p class="hint">来自插件的数据只作为画像线索，不用于判断当前存活。未提供端口时不推断端口。</p><div class="table-wrap"><table><thead><tr><th>来源 / 目标</th><th>标题 / Server</th><th>HTTP / TLS</th><th>其他证据</th><th>最近取得</th></tr></thead><tbody><tr v-for="(ev,i) in (detail.asset.plugin_evidence||[])" :key="i"><td>{{ev.source}}<small class="cell-sub">{{ev.ip||detail.asset.host}} · {{ev.port||'端口未提供'}} {{ev.port?ev.protocol:''}}</small></td><td>{{ev.fields.title||'—'}}<small class="cell-sub">{{ev.fields.server}}</small></td><td>{{ev.fields.status_code||'—'}}<small class="cell-sub">{{ev.fields.tls_subject}}</small></td><td>{{ev.fields.service||ev.fields.scheme||'—'}}<small class="cell-sub">{{ev.fields.banner}}</small><small class="cell-sub mono">{{ev.fields.favicon_sha256}}</small></td><td>{{date(ev.obtained_at||ev.observed_at)}}<small class="cell-sub" v-if="ev.account_id">来源账户 #{{ev.account_id}}</small><small class="cell-sub">供应商更新时间：{{ev.provider_time?date(ev.provider_time):(ev.provider_time_raw||'未知')}}{{ev.provider_time_raw&&!ev.provider_time?'（时区未核实，保留原文）':''}}</small><small class="cell-sub" v-if="ev.provider_time_meaning">时间含义：供应商更新时间；不代表实际扫描时间</small></td></tr><tr v-if="!detail.asset.plugin_evidence?.length"><td colspan="5" class="empty">暂无插件画像证据。</td></tr></tbody></table></div><h3>变化快照（最近 30 次）</h3><div v-for="s in detail.snapshots" class="history-row"><b>{{date(s.created_at)}} · #{{s.job_id}}</b><p>{{s.payload.ips?.join(', ')}} · {{s.payload.status_code||'未探测'}} · {{s.payload.title}}</p></div><h3>关联事件</h3><p v-for="ev in detail.events">{{date(ev.created_at)}} · {{eventSummary(ev)}}</p><p v-if="!detail.snapshots.length&&!detail.events.length" class="empty">暂无历史，后续任务将补充画像。</p></section></div>
</template></div></body></html>
