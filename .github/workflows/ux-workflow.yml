name: Target workflow acceptance
on:
  workflow_dispatch:
  push:
    branches: [batch-p0-p1]
    paths: ['web/**', 'api_v2.go', 'enterprise_api.go', 'source_*.go', 'queue.go', 'ux*test.go', 'ui_semantics_test.cjs', '.github/workflows/ux-workflow.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_DB: scopedesk_p0
          POSTGRES_USER: scopedesk_p0
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U scopedesk_p0 -d scopedesk_p0"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://scopedesk_p0@127.0.0.1:5432/scopedesk_p0?sslmode=disable
      P0_ISOLATED: ephemeral-ci
      P0_ARTIFACT_DIR: ${{ github.workspace }}/ux-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Record exact source and isolated key
        run: |
          key=$(openssl rand -base64 32)
          echo "::add-mask::$key"
          echo "RECON_MASTER_KEY=$key" >> "$GITHUB_ENV"
          mkdir -p "$P0_ARTIFACT_DIR"
          git rev-parse HEAD > "$P0_ARTIFACT_DIR/commit.txt"
          sha256sum web/app.js web/index.html web/style.css api_v2.go queue.go source_*.go ux*test.go ui_semantics_test.cjs > "$P0_ARTIFACT_DIR/source.sha256"
      - name: UI behavior acceptance
        run: node --test --test-reporter=tap ui_semantics_test.cjs > "$P0_ARTIFACT_DIR/ui.tap"
      - name: Saved defaults, source compatibility and target history with race detection
        run: go test -race -json -count=1 -timeout=6m -run '^(TestUX.*|TestSourcePolicyCombinations)$' . > "$P0_ARTIFACT_DIR/ux-tests.jsonl"
      - name: Authorization, scheduling, enterprise handoff and HTTP absence regressions
        run: go test -race -json -count=1 -timeout=6m -run '^(TestPostgresScope.*|TestPostgresEnterprise.*|TestEnterprise.*|TestPostgresProject.*|TestPostgresScheduler.*|TestW04.*|TestW30.*|TestScopeGuardBoundaries|TestBudgetIsAtomic|TestPostgresQueueClaimsAndLeaseRecovery|TestPostgresCandidateSnapshotCannotAuthorizeProbeOrCommit)$' . > "$P0_ARTIFACT_DIR/regression-tests.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-workflow-${{ github.sha }}
          path: ux-artifacts/
          retention-days: 14
          if-no-files-found: error
